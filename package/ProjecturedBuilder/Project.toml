name = "ProjecturedBuilder"
uuid = "0a3f89a0-eb60-4886-852e-6c06a63572e2"
version = "0.1.0"
authors = []

# The build front-end for the native executable: a BuildSpec describes the editor
# to bake in, `build_executable` turns it into a binary. Deliberately depends on
# no backend package — a backend is named by its TYPE at the call site and
# everything the builder needs is derived from that type by reflection, so
# `using ProjecturedSdl, ProjecturedBuilder` composes without the builder ever
# knowing SDL exists. PackageCompiler is added to the app environment during a
# compile rather than declared here, for the same reason: it is the app's build
# dependency, not the builder's.

[deps]
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"

[compat]
julia = "1.10"
