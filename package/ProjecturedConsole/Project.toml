name = "ProjecturedConsole"
uuid = "d7d6c9a1-04d6-4ada-9cc1-b2de81f79968"
version = "0.1.0"
authors = []

# The console backend. It renders the text domain to an ANSI terminal and needs
# no third-party package.

[deps]
ProjecturedKernel = "a3e3499a-684d-4df9-a0d6-de2d1797b1f3"
ProjecturedPlatform = "b21cb890-5227-4e91-ae0e-8ab4d844f9f7"
ProjecturedPrecompile = "8baac0ef-e501-42fc-bcd5-0b2a8f58a069"

[sources]
ProjecturedKernel = {path = "../ProjecturedKernel"}
ProjecturedPlatform = {path = "../ProjecturedPlatform"}
ProjecturedPrecompile = {path = "../ProjecturedPrecompile"}

# AutoIntegration loads this package when Projectured is loaded, unless the
# environment of the user sets it to "manual".
[auto-integration]
default = "auto"

[auto-integration.triggers]
Projectured = "92922de3-b970-4d9a-8b2a-9d6f361397b5"
