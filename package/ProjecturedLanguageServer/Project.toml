name = "ProjecturedLanguageServer"
uuid = "1a85e49b-8115-4d59-ab70-0d3513ffc95a"
version = "0.1.0"
authors = []

[deps]
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
ProjecturedKernel = "a3e3499a-684d-4df9-a0d6-de2d1797b1f3"
ProjecturedPlatform = "b21cb890-5227-4e91-ae0e-8ab4d844f9f7"

[sources]
ProjecturedKernel = {path = "../ProjecturedKernel"}
ProjecturedPlatform = {path = "../ProjecturedPlatform"}

[compat]
JSON3 = "1.14.3"

# AutoIntegration loads this package when Projectured is loaded, unless the
# environment of the user sets it to "manual". With no language server installed,
# a source file opens as plain text.
[auto-integration]
default = "auto"

[auto-integration.triggers]
Projectured = "92922de3-b970-4d9a-8b2a-9d6f361397b5"
