# Test package for the opt-in ProjecturedSdl backend: the dirty-rect diff and
# the GraphicsCanvas -> image-file path (write_image). Needs native SDL2, so it
# precompiles/runs only where SDL is installed. Resolves through the root env
# (no [sources]), like the opt-in example packages.

