# The ODBC opt-in example package: the live-database catalog / SQL-table
# examples (need a reachable PostgreSQL + ProjecturedOdbc). Reuses the
# ProjecturedExample harness + engine-free builders. Like the umbrella it
# resolves through the root env (no [sources]); it precompiles only where the
# ODBC driver is installed.

[deps]
Projectured = "92922de3-b970-4d9a-8b2a-9d6f361397b5"
ProjecturedExample = "e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b"
ProjecturedOdbc = "aed26263-2fd3-42de-9b03-7ee91ffa11a3"
