# The platform tier of the example-package DAG: syntax and text documents, the
# widget gallery, the layouts, the collection views, the text decorators, and
# the platform half of the example harness (print_example, write_example_pdf).
# SDL is reached through the make_backend seam alone, so there is no opt-in
# dependency.

