# ProjecturedKernelTest is the base of the test-package DAG that parallels the
# main DAG (see plan/done/test-package-split.md). It hosts (a) the
# kernel's own unit tests and (b) the shared generic test drivers
# (test_printer, test_reader, test_repl, the navigation explorers, the
# reflexive `_walk!` walker, and the static `check_layering` guard) that
# ProjecturedPlatformTest, each domain's test package, and the ProjecturedTest
# umbrella reuse.

