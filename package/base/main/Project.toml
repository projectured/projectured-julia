# ProjecturedBase depends only on ProjecturedKernel: the concrete engine
# documents (Collection, Primitive, ScreenDocument) and, from P8, the
# document-shaped generic projections. Layered between kernel and domain in
# the plan/done/kernel-layered-architecture.md dependency chain:
#   kernel → base → domain → umbrella
# opt-in packages (sdl/web/odbc/…) still depend on domain, not base.

[deps]
InteractiveUtils = "b77e0a4c-d291-57a0-90e8-8db25a27a240"
ProjecturedCollection = "8bcd16db-087d-4f4f-9083-436e400a73ed"
ProjecturedDomain = "56e9f339-7147-459f-9ae1-7785cace5f24"
ProjecturedKernel = "a3e3499a-684d-4df9-a0d6-de2d1797b1f3"
ProjecturedPrimitive = "a792d3c9-f446-49ae-a65b-985afeeb5ba4"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"

[sources]
ProjecturedKernel = {path = "../../kernel/main"}
