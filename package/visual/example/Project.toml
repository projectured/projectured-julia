# The visual tier of the example-package DAG (see
# plan/done/example-package-split.md): syntax/text documents, the widget
# gallery, layouts, the collection views, the text decorators, and the visual
# half of the example harness (print_example, write_example_pdf). SDL is only
# reached through the make_backend seam — no opt-in dependency.

