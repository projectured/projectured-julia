# The shell of a window: the fold that stacks its wrappers, and the projection
# that draws its chrome.
#
# Its toolbar holds the tools of the window, so it names the slices of the six
# tools it opens: the assistant, the evaluator (conversation), the fault log, the
# selection (inspector), the message log and the frame statistics.

