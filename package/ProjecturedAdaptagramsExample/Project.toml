# The Adaptagrams opt-in example package: the native-graph-layout examples
# (`graph_adaptagrams` and the `dvdrental_relationship` entity-relationship
# diagram). Keeps projection/Graph.jl whole; the relationship's DB-derived
# document comes from ProjecturedODBCExample (the one cross-engine example).
# Resolves through the root env; precompiles only where the ProjecturedAdaptagrams
# C++ shim is built (and, for the relationship example, a live DB is reachable).

[deps]
ProjecturedAdaptagrams = "c86b9063-147e-43d0-b3a0-65343fae9a66"
ProjecturedAll = "3e41c706-0d64-40b0-8e9d-89616f7fa6cc"
