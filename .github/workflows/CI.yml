# The static guards and the test suite of every test package, with coverage.
#
# Each test package runs in its own environment, so a suite that uses a package
# its Project.toml does not name fails here. The umbrella loads through
# environment/all, the one environment that names every package
# (documentation/guide/testing-guide.md); its suite has two jobs, the tests of
# the packages and the tests that read this repository.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['plan/**']
  pull_request:
    paths-ignore: ['plan/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # Each guard reads the source as text and loads no package.
      - name: Run each guard
        run: |
          status=0
          for guard in test/suite/*.jl; do
            echo "::group::$guard"
            julia --startup-file=no "$guard" || status=1
            echo "::endgroup::"
          done
          exit $status

  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write          # the upload to Codecov through OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: ProjecturedKernelTest, run: test_kernel}
          - {package: ProjecturedPlatformTest, run: test_platform}
          - {package: ProjecturedJSONTest, run: test_json}
          - {package: ProjecturedYAMLTest, run: test_yaml}
          - {package: ProjecturedXMLTest, run: test_xml}
          - {package: ProjecturedMarkdownTest, run: test_markdown}
          - {package: ProjecturedRSTTest, run: test_rst}
          - {package: ProjecturedBookTest, run: test_book}
          - {package: ProjecturedMathTest, run: test_math}
          - {package: ProjecturedJuliaTest, run: test_julia}
          - {package: ProjecturedSQLTest, run: test_sql}
          - {package: ProjecturedDatabaseTest, run: test_database}
          - {package: ProjecturedDBCatalogTest, run: test_dbcatalog}
          - {package: ProjecturedGraphTest, run: test_graph}
          - {package: ProjecturedChartTest, run: test_chart}
          - {package: ProjecturedSequenceChartTest, run: test_sequencechart}
          - {package: ProjecturedFormulaTest, run: test_formula}
          - {package: ProjecturedFSMTest, run: test_fsm}
          - {package: ProjecturedProcessTest, run: test_process}
          - {package: ProjecturedAnthropicTest, run: test_anthropic}
          - {package: ProjecturedOllamaTest, run: test_ollama}
          - {package: ProjecturedOpenRouterTest, run: test_openrouter}
          - {package: ProjecturedDataFramesTest, run: test_dataframes}
          - {package: ProjecturedConsoleTest, run: test_console}
          - {package: ProjecturedPDFTest, run: test_pdf}
          - {package: ProjecturedWebTest, run: test_web}
          - {package: ProjecturedMCPTest, run: test_mcp}
          - {package: ProjecturedSDLTest, run: test_sdl}
          - {package: ProjecturedTulipTest, run: test_tulip}
          - {package: ProjecturedVideoTest, run: test_video}
          - {package: ProjecturedODBCTest, run: test_odbc}
          - {package: ProjecturedBuilderTest, run: test_builder}
          - {package: ProjecturedTest, run: test_integration, project: environment/all}
          - {package: ProjecturedTest, run: test_repository, project: environment/all}
    env:
      PROJECT: ${{ matrix.project || format('package/{0}', matrix.package) }}
      SDL_VIDEODRIVER: offscreen   # SDL draws into memory; the runner has no display
    steps:
      - uses: actions/checkout@v7
      # environment/all names AutoIntegration by the folder beside this
      # repository.
      - uses: actions/checkout@v7
        if: matrix.project == 'environment/all'
        with:
          repository: projectured/AutoIntegration.jl
          path: auto-integration
      - name: Place AutoIntegration beside the repository
        if: matrix.project == 'environment/all'
        run: mv auto-integration ../auto-integration
      # environment/all names AgentClientProtocol by the folder beside this
      # repository too.
      - uses: actions/checkout@v7
        if: matrix.project == 'environment/all'
        with:
          repository: projectured/AgentClientProtocol.jl
          path: agent-client-protocol
      - name: Place AgentClientProtocol beside the repository
        if: matrix.project == 'environment/all'
        run: mv agent-client-protocol ../agent-client-protocol
      # And ClaudeCodeACP.
      - uses: actions/checkout@v7
        if: matrix.project == 'environment/all'
        with:
          repository: projectured/ClaudeCodeACP.jl
          path: claude-code-acp
      - name: Place ClaudeCodeACP beside the repository
        if: matrix.project == 'environment/all'
        run: mv claude-code-acp ../claude-code-acp
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project="$PROJECT" -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      # Coverage only for the files of this repository, so the dependencies
      # keep their compiled images.
      - name: Test
        run: >-
          julia --code-coverage=@. --project="$PROJECT"
          -e 'using ${{ matrix.package }}; ${{ matrix.run }}()'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: source,package,example,test
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: ${{ matrix.package }}
          use_oidc: true
          fail_ci_if_error: false
