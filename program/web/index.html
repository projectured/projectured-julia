<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjecturEd — Web</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1b1b1b; color: #ddd; }
    #host { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1rem; }
    #launch { font-size: 1.1rem; padding: 0.6rem 1.4rem; cursor: pointer; border-radius: 6px; border: 1px solid #555; background: #2d2d2d; color: #eee; }
    #launch:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 0.9rem; color: #999; max-width: 40rem; text-align: center; }
    code { color: #b5cea8; }
  </style>
</head>
<body>
  <div id="host">
    <button id="launch" disabled>Launch editor windows</button>
    <div id="status">Loading fonts…</div>
    <div id="status2" style="font-size:0.8rem;color:#777;max-width:40rem;text-align:center;">
      Each editor window opens as a browser popup. If nothing appears, allow
      pop-ups for this site and click <em>Launch</em> again.
    </div>
  </div>
  <script src="/client.js"></script>
</body>
</html>
